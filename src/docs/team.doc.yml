paths:
  /team:
    get:
      tags:
        - Team
      summary: Listar todos los equipos
      description: Retorna una lista con todos los equipos (parejas de jugadores) registrados.
      responses:
        200:
          description: Listado de equipos obtenido exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'

    post:
      tags:
        - Team
      summary: Registrar nuevo equipo
      description: Crea un equipo formado por dos jugadores distintos. Verifica que los jugadores existan y que no formen ya un equipo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        201:
          description: Equipo creado.
        400:
          description: Jugadores iguales o equipo ya existente.

  /team/player/{ci}:
    get:
      tags:
        - Team
      summary: Listar equipos de un jugador
      parameters:
        - name: ci
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Equipos donde participa el jugador.

  /team/{id}:
    get:
      tags:
        - Team
      summary: Obtener equipo por ID
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        200:
          description: Detalles del equipo.

    put:
      tags:
        - Team
      summary: Actualización completa del equipo
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        200:
          description: Equipo actualizado.

    patch:
      tags:
        - Team
      summary: Actualización parcial del equipo
      description: Permite cambiar uno de los integrantes del equipo o el nombre sin re-enviar todo el objeto.
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                player1_ci:
                  type: string
                player2_ci:
                  type: string
      responses:
        200:
          description: Equipo actualizado parcialmente.

    delete:
      tags:
        - Team
      summary: Eliminar equipo
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        200:
          description: Equipo eliminado.

components:
  parameters:
    idParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    Team:
      type: object
      properties:
        team_id:
          type: integer
        name:
          type: string
          nullable: true
        player1_ci:
          type: string
        player2_ci:
          type: string
        Player1:
          $ref: '#/src/docs/player.doc.yml#/components/schemas/Player'
        Player2:
          $ref: '#/src/docs/player.doc.yml#/components/schemas/Player'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TeamInput:
      type: object
      required:
        - player1_ci
        - player2_ci
      properties:
        name:
          type: string
        player1_ci:
          type: string
        player2_ci:
          type: string
