tags:
  - name: Match
    description: API para operaciones con partidos

paths:
  /match:
    get:
      tags:
        - Match
      summary: Obtiene todos los partidos
      description: Retorna un array con todos los partidos registrados
      responses:
        200:
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  matches:
                    type: array
                    items:
                      $ref: '#/components/schemas/Match'
        500:
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Match
      summary: Crea un nuevo partido
      description: Crea un nuevo partido con los datos proporcionados
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchInput'
      responses:
        201:
          description: Partido creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  match:
                    $ref: '#/components/schemas/Match'
        400:
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Match:
      type: object
      properties:
        match_id:
          type: integer
          example: 1
        tournament_id:
          type: integer
          example: 1
        inscription1_id:
          type: integer
          example: 10
        inscription2_id:
          type: integer
          example: 11
        winner_inscription_id:
          type: integer
          nullable: true
          example: 10
        match_datetime:
          type: string
          format: date-time
          nullable: true
          example: "2023-05-15T14:00:00Z"
        round:
          type: string
          example: "Cuartos de final"
        status:
          type: string
          enum: [Pendiente, "En Juego", Finalizado]
          example: "Pendiente"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - tournament_id
        - inscription1_id
        - inscription2_id
        - round

    MatchInput:
      type: object
      properties:
        tournament_id:
          type: integer
          example: 1
        inscription1_id:
          type: integer
          example: 10
        inscription2_id:
          type: integer
          example: 11
        match_datetime:
          type: string
          format: date-time
          nullable: true
          example: "2023-05-15T14:00:00Z"
        round:
          type: string
          example: "Cuartos de final"
        status:
          type: string
          enum: [Pendiente, "En Juego", Finalizado]
          example: "Pendiente"
      required:
        - tournament_id
        - inscription1_id
        - inscription2_id
        - round
