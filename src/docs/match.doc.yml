paths:
  /match:
    get:
      tags:
        - Match
      summary: Listar todos los partidos (Paginado)
      description: Retorna un historial de los partidos registrados con soporte para paginación. Por defecto retorna todos si no se especifican límites.
      parameters:
        - name: limit
          in: query
          description: Cantidad de registros por página (ej. 30, 50, 70).
          schema:
            type: integer
        - name: page
          in: query
          description: Número de página a recuperar.
          schema:
            type: integer
      responses:
        200:
          description: Listado de partidos obtenido exitonamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListResponse'
        500:
          $ref: '#/components/responses/ErrorServer'

    post:
      tags:
        - Match
      summary: Crear nuevo partido (Directo)
      description: Registra un partido finalizado o pendiente directamente en el sistema.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchInput'
      responses:
        201:
          description: Partido creado correctamente.
        401:
          $ref: '#/components/responses/Unauthorized'

  /match/propose:
    post:
      tags:
        - Match
      summary: Proponer el resultado de un partido a otro jugador
      description: Cambia el estado del partido a 'Propuesto' tras cargar los sets y envía una notificación en tiempo real vía socket ('resultProposed') al oponente para su validación.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchInput'
      responses:
        201:
          description: Propuesta de partido enviada.

  /match/{id}:
    get:
      tags:
        - Match
      summary: Obtener detalles de un partido
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        200:
          description: Detalles del partido.
        404:
          description: Partido no encontrado.

    put:
      tags:
        - Match
      summary: Actualización completa del partido
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchInput'
      responses:
        200:
          description: Partido actualizado.

    patch:
      tags:
        - Match
      summary: Actualización parcial o de resultado
      description: Permite actualizar el ganador, el estado o la fecha sin enviar todo el objeto. Si se agrega un ganador, el estado cambia automáticamente a 'Finalizado' y se recalcula el AURA.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                winner_inscription_id:
                  type: integer
                status:
                  type: string
                  enum: [Propuesto, Pendiente, Finalizado]
                match_datetime:
                  type: string
                  format: date-time
      responses:
        200:
          description: Partido actualizado parcialmente.

    delete:
      tags:
        - Match
      summary: Eliminar partido (Soft)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        200:
          description: Partido eliminado.

  /match/{id}/cascade:
    delete:
      tags:
        - Match
      summary: Eliminación en cascada y reversión de AURA
      description: Elimina el partido, sus sets y registros de AURA. Además, revierte el cálculo de AURA de los jugadores involucrados.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        200:
          description: Partido y dependencias eliminadas, AURA revertida.

  /match/player/{player_ci}:
    get:
      tags:
        - Match
      summary: Listar partidos por jugador
      parameters:
        - name: player_ci
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Partidos del jugador obtenidos.

components:
  parameters:
    idParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    ErrorServer:
      description: Error interno del servidor.
    Unauthorized:
      description: Token no proporcionado o inválido.

  schemas:
    Match:
      type: object
      properties:
        match_id:
          type: integer
        tournament_id:
          type: integer
        inscription1_id:
          type: integer
        inscription2_id:
          type: integer
        winner_inscription_id:
          type: integer
          nullable: true
        match_datetime:
          type: string
          format: date-time
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MatchInput:
      type: object
      required:
        - tournament_id
        - inscription1_id
        - inscription2_id
      properties:
        tournament_id:
          type: integer
        inscription1_id:
          type: integer
        inscription2_id:
          type: integer
        match_datetime:
          type: string
          format: date-time

    MatchListResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Match'
        meta:
          type: object
          properties:
            totalItems:
              type: integer
            itemsPerPage:
              type: integer
            currentPage:
              type: integer
            totalPages:
              type: integer
