tags:
  - name: AuraRecord
    description: API para gestionar los registros de aura de los jugadores

paths:
  /aura-record:
    get:
      tags:
        - AuraRecord
      summary: Obtiene todos los registros de aura
      description: Retorna un array con todos los registros de aura.
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuraRecord'
        '500':
          description: Error del servidor

    post:
      tags:
        - AuraRecord
      summary: Crea un nuevo registro de aura
      description: Crea un nuevo registro de aura con los datos proporcionados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuraRecordInput'
      responses:
        '201':
          description: Registro de aura creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AuraRecord'
        '400':
          description: Datos inválidos
        '500':
          description: Error al crear el registro de aura

  /aura-record/{id}:
    get:
      tags:
        - AuraRecord
      summary: Obtiene un registro de aura por ID
      description: Retorna un registro de aura según el ID proporcionado.
      parameters:
        - name: id
          in: path
          description: ID del registro de aura
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AuraRecord'
        '404':
          description: Registro de aura no encontrado
        '500':
          description: Error al obtener el registro de aura

    put:
      tags:
        - AuraRecord
      summary: Actualiza un registro de aura
      description: Actualiza los datos de un registro de aura según el ID proporcionado.
      parameters:
        - name: id
          in: path
          description: ID del registro de aura
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuraRecordUpdate'
      responses:
        '200':
          description: Registro de aura actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AuraRecord'
        '400':
          description: Datos inválidos
        '404':
          description: Registro de aura no encontrado
        '500':
          description: Error al actualizar el registro de aura

    delete:
      tags:
        - AuraRecord
      summary: Elimina un registro de aura
      description: Elimina un registro de aura según el ID proporcionado.
      parameters:
        - name: id
          in: path
          description: ID del registro de aura
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Registro de aura eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Registro de aura no encontrado
        '500':
          description: Error al eliminar el registro de aura

  /aura-record/player/{ci}:
    get:
      tags:
        - AuraRecord
      summary: Obtiene registros de aura por jugador
      description: Retorna todos los registros de aura de un jugador específico.
      parameters:
        - name: ci
          in: path
          description: Cédula de identidad del jugador
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuraRecord'
        '404':
          description: Jugador no encontrado
        '500':
          description: Error al obtener los registros

  /aura-record/match/{matchId}:
    get:
      tags:
        - AuraRecord
      summary: Obtiene registros de aura por partido
      description: Retorna todos los registros de aura de un partido específico.
      parameters:
        - name: matchId
          in: path
          description: ID del partido
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuraRecord'
        '404':
          description: Partido no encontrado
        '500':
          description: Error al obtener los registros

components:
  schemas:
    AuraRecord:
      type: object
      properties:
        id:
          type: integer
          description: ID del registro de aura
        match_id:
          type: integer
          description: ID del partido asociado
        player_ci:
          type: string
          description: Cédula del jugador asociado
        aura:
          type: integer
          description: Cantidad de aura ganada o perdida
        date:
          type: string
          format: date-time
          description: Fecha en que se registró el aura
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación del registro
        updatedAt:
          type: string
          format: date-time
          description: Fecha de última actualización del registro

    AuraRecordInput:
      type: object
      required:
        - match_id
        - player_ci
        - aura
        - date
      properties:
        match_id:
          type: integer
          description: ID del partido asociado
        player_ci:
          type: string
          description: Cédula del jugador asociado
        aura:
          type: integer
          description: Cantidad de aura ganada o perdida
        date:
          type: string
          format: date-time
          description: Fecha en que se registró el aura

    AuraRecordUpdate:
      type: object
      properties:
        match_id:
          type: integer
          description: ID del partido asociado
        player_ci:
          type: string
          description: Cédula del jugador asociado
        player:
          $ref: '#/components/schemas/Player'
          description: Objeto con los datos del jugador asociado
        aura:
          type: integer
          description: Cantidad de aura ganada o perdida
        date:
          type: string
          format: date-time
          description: Fecha en que se registró el aura

    Player:
      type: object
      properties:
        ci:
          type: string
          example: "123456789"
        first_name:
          type: string
          example: "Juan"
        last_name:
          type: string
          example: "Perez"
        phone:
          type: string
          example: "04123456789"
        semester:
          type: integer
          example: 5
        career_id:
          type: integer
          example: 1
        aura:
          type: integer
          example: 1300
        status:
          type: boolean
          example: true
