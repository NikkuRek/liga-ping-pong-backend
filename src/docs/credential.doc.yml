paths:
  /credential:
    get:
      tags:
        - Credential
      summary: Obtiene todas las credenciales
      description: Retorna un array con todas las credenciales y la información básica del jugador asociado.
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Credential'
        '500':
          description: Error del servidor

    post:
      tags:
        - Credential
      summary: Crea una nueva credencial
      description: Crea una nueva credencial para un jugador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInput'
      responses:
        201:
          description: Credencial creada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Credential'
        400:
          description: Ya existe una credencial para este jugador o datos inválidos
        404:
          description: Jugador no encontrado
        500:
          description: Error al crear credencial

    put:
      tags:
        - Credential
      summary: Actualiza una credencial por CI del jugador
      description: Actualiza la contraseña de una credencial buscando por la CI del jugador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                player_ci:
                  type: string
                  description: CI del jugador cuya credencial se actualizará.
                password:
                  type: string
                  description: Nueva contraseña (mínimo 6 caracteres).
              required:
                - player_ci
                - password
      responses:
        '200':
          description: Credencial actualizada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Credential'
        '404':
          description: Credencial no encontrada para este jugador
        '500':
          description: Error al actualizar credencial

  /credential/{id}:
    get:
      tags:
        - Credential
      summary: Obtiene una credencial por ID
      description: Retorna una credencial según el ID proporcionado.
      parameters:
        - name: id
          in: path
          description: ID de la credencial
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Credential'
        '404':
          description: Credencial no encontrada
        '500':
          description: Error al obtener credencial
    put:
      tags:
        - Credential
      summary: Actualiza una credencial por ID
      description: Actualiza la contraseña de una credencial según su ID.
      parameters:
        - name: id
          in: path
          description: ID de la credencial
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Nueva contraseña (mínimo 6 caracteres).
              required:
                - password
      responses:
        200:
          description: Credencial actualizada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Credential'
        404:
          description: Credencial no encontrada
        500:
          description: Error al actualizar credencial
    delete:
      tags:
        - Credential
      summary: Elimina una credencial
      description: Elimina una credencial según el ID proporcionado
      parameters:
        - name: id
          in: path
          description: ID de la credencial
          required: true
          schema:
            type: string
      responses:
        200:
          description: Credencial eliminada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: Credencial no encontrada
        500:
          description: Error al eliminar credencial

  /credential/player/{player_ci}:
    get:
      tags:
        - Credential
      summary: Obtiene credencial por CI de jugador
      description: Retorna la credencial asociada al jugador según la CI proporcionada
      parameters:
        - name: player_ci
          in: path
          description: CI del jugador
          required: true
          schema:
            type: string
      responses:
        200:
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Credential'
        404:
          description: Credencial no encontrada para este jugador
        500:
          description: Error al obtener credencial

  /credential/authenticate:
    post:
      tags:
        - Credential
      summary: Autentica credenciales de un jugador
      description: Verifica la CI y contraseña de un jugador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                player_ci:
                  type: string
                  description: CI del jugador
                password:
                  type: string
                  description: Contraseña
      responses:
        200:
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                    description: JWT token para autenticación
                  user:
                    type: object
                    properties:
                      ci:
                        type: string
                        description: CI del jugador
                      first_name:
                        type: string
                        description: Nombre del jugador
                      last_name:
                        type: string
                        description: Apellido del jugador
                      phone:
                        type: string
                        description: Teléfono
                      semester:
                        type: integer
                        description: Semestre
                      career_id:
                        type: integer
                        description: ID de carrera
                      aura:
                        type: number
                        description: Aura del jugador
                      status:
                        type: boolean
                        description: Estado del jugador
        401:
          description: Contraseña incorrecta
        404:
          description: Credenciales no encontradas
        500:
          description: Error en autenticación

components:
  schemas:
    Credential:
      type: object
      properties:
        credential_id:
          type: integer
          description: ID de la credencial
        player_ci:
          type: string
          description: CI del jugador
        password:
          type: string
          description: Contraseña encriptada
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación
        updatedAt:
          type: string
          format: date-time
          description: Fecha de última actualización
        Player:
          type: object
          properties:
            ci:
              type: string              
            name:
              type: string              
            lastname:
              type: string

    CredentialInput:
      type: object
      properties:
        player_ci:
          type: string
          description: CI del jugador
        password:
          type: string
          description: Contraseña (mínimo 6 caracteres)
      required:
        - player_ci
        - password