paths:
  /credential:
    get:
      tags:
        - Credential
      summary: Listar todas las credenciales
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de credenciales.
        401:
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Credential
      summary: Crear credencial para un jugador
      description: Asocia una contraseña a un jugador (identificado por CI).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - player_ci
                - password
              properties:
                player_ci:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: Credencial creada.

  /credential/authenticate:
    post:
      tags:
        - Credential
      summary: Iniciar sesión (Login)
      description: Valida las credenciales y establece una cookie HttpOnly llamada 'token'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - player_ci
                - password
              properties:
                player_ci:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Autenticación exitosa. Se establece la cookie 'token'.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=abc123jwt; HttpOnly; Secure; SameSite=None
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/src/docs/player.doc.yml#/components/schemas/Player'
        401:
          description: Credenciales inválidas.

  /credential/logout:
    post:
      tags:
        - Credential
      summary: Cerrar sesión
      description: Elimina la cookie 'token' del navegador.
      responses:
        200:
          description: Sesión cerrada.

  /credential/{id}:
    get:
      tags:
        - Credential
      summary: Obtener credencial por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Datos de la credencial (sin password).

    put:
      tags:
        - Credential
      summary: Actualización completa de credencial
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInput'
      responses:
        200:
          description: Credencial actualizada.

    patch:
      tags:
        - Credential
      summary: Cambio parcial de credencial (ej. Password)
      description: Permite actualizar solo la contraseña de una credencial específica.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Nueva contraseña (será hasheada automáticamente).
      responses:
        200:
          description: Contraseña actualizada correctamente.

    delete:
      tags:
        - Credential
      summary: Eliminar credencial
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Credencial eliminada.

components:
  responses:
    Unauthorized:
      description: No autorizado. Requiere JWT válido.

  schemas:
    CredentialInput:
      type: object
      properties:
        player_ci:
          type: string
        password:
          type: string