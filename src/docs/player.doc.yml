paths:
  /player:
    get:
      tags:
        - Player
      summary: Listar todos los jugadores
      description: Retorna una lista completa de todos los jugadores registrados en el sistema, incluyendo sus detalles básicos.
      responses:
        200:
          description: Lista de jugadores obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Jugadores obtenidos correctamente"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Player'
        500:
          $ref: '#/components/responses/ErrorServer'

    post:
      tags:
        - Player
      summary: Registrar nuevo jugador
      description: Crea un nuevo perfil de jugador. Requiere datos personales y la lista de días disponibles para jugar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - playerData
                - available_days
              properties:
                playerData:
                  $ref: '#/components/schemas/PlayerInput'
                available_days:
                  $ref: '#/components/schemas/AvailableDays'
      responses:
        201:
          description: Jugador registrado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        400:
          description: Error en la validación de los datos proporcionados.
        500:
          $ref: '#/components/responses/ErrorServer'

  /player/active:
    get:
      tags:
        - Player
      summary: Listar jugadores activos
      description: Retorna únicamente los jugadores que tienen su estado marcado como activo (true).
      responses:
        200:
          description: Lista de jugadores activos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerListResponse'

  /player/inactive:
    get:
      tags:
        - Player
      summary: Listar jugadores inactivos
      description: Retorna únicamente los jugadores que han sido deshabilitados (status false).
      responses:
        200:
          description: Lista de jugadores inactivos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerListResponse'

  /player/{ci}:
    get:
      tags:
        - Player
      summary: Buscar jugador por CI
      parameters:
        - $ref: '#/components/parameters/ciParam'
      responses:
        200:
          description: Datos del jugador encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        404:
          description: No existe un jugador con el CI proporcionado.

    put:
      tags:
        - Player
      summary: Actualización completa de jugador
      description: Sobrescribe todos los datos de un jugador existente.
      parameters:
        - $ref: '#/components/parameters/ciParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playerData:
                  $ref: '#/components/schemas/PlayerInput'
                available_days:
                  $ref: '#/components/schemas/AvailableDays'
      responses:
        200:
          description: Jugador actualizado exitosamente.
        404:
          description: Jugador no encontrado.

    patch:
      tags:
        - Player
      summary: Actualización parcial de jugador
      description: Permite modificar uno o varios campos específicos de un jugador sin afectar el resto.
      parameters:
        - $ref: '#/components/parameters/ciParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerInput'
      responses:
        200:
          description: Campos actualizados correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        404:
          description: Jugador no encontrado.

    delete:
      tags:
        - Player
      summary: Deshabilitación lógica (Borrado suave)
      description: Cambia el estado del jugador a 'inactivo' pero conserva sus datos en la base de datos.
      parameters:
        - $ref: '#/components/parameters/ciParam'
      responses:
        200:
          description: Jugador deshabilitado correctamente.

  /player/delete/{ci}:
    delete:
      tags:
        - Player
      summary: Eliminación física
      description: Borra permanentemente el registro del jugador de la base de datos. NO SE PUEDE DESHACER.
      parameters:
        - $ref: '#/components/parameters/ciParam'
      responses:
        200:
          description: Registro eliminado permanentemente.

components:
  parameters:
    ciParam:
      name: ci
      in: path
      description: Cédula de Identidad del jugador (Primary Key)
      required: true
      schema:
        type: string
        example: "1234567"

  responses:
    ErrorServer:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Ha ocurrido un error inesperado"

  schemas:
    Player:
      type: object
      properties:
        ci:
          type: string
          example: "1234567"
        first_name:
          type: string
          example: "Juan"
        last_name:
          type: string
          example: "Pérez"
        phone:
          type: string
          example: "0981234567"
        semester:
          type: integer
          example: 5
        career_id:
          type: integer
          example: 1
        aura:
          type: integer
          example: 1200
        status:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlayerInput:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        semester:
          type: integer
        career_id:
          type: integer
        aura:
          type: integer

    AvailableDays:
      type: array
      items:
        type: integer
      description: IDs de los días (1=Lunes, 7=Domingo)
      example: [1, 3, 5]

    PlayerResponse:
      type: object
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/Player'

    PlayerListResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Player'