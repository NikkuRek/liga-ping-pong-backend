paths:
  /player:
    get:
      tags:
        - Player
      summary: Obtiene todos los jugadores
      description: Retorna un array con todos los jugadores
      responses:
        200:
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Player'
        500:
          description: Error del servidor

    post:
      tags:
        - Player
      summary: Crea un nuevo jugador
      description: Crea un nuevo jugador con los datos proporcionados, incluyendo los días disponibles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playerData:
                  $ref: '#/components/schemas/Player'
                available_days:
                  $ref: '#/components/schemas/available_days'
      responses:
        201:
          description: Jugador creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Player'
        400:
          description: Datos inválidos
        500:
          description: Error al crear jugador

  /player/active:
    get:
      tags:
        - Player
      summary: Obtiene jugadores activos
      description: Retorna un array con todos los jugadores que están activos
      responses:
        200:
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Player'
        500:
          description: Error del servidor

  /player/inactive:
    get:
      tags:
        - Player
      summary: Obtiene jugadores inactivos
      description: Retorna un array con todos los jugadores que están inactivos
      responses:
        200:
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Player'
        500:
          description: Error del servidor

  /player/{ci}:
    get:
      tags:
        - Player
      summary: Obtiene un jugador por CI
      description: Retorna un jugador según la CI proporcionado
      parameters:
        - name: ci
          in: path
          description: CI del jugador
          required: true
          schema:
            type: string
      responses:
        200:
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Player'
        404:
          description: Jugador no encontrado
        500:
          description: Error del servidor

    put:
      tags:
        - Player
      summary: Actualiza un jugador
      description: Actualiza los datos de un jugador según la CI proporcionado, incluyendo los días disponibles
      parameters:
        - name: ci
          in: path
          description: CI del jugador
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playerData:
                  $ref: '#/components/schemas/Player'
                available_days:
                  $ref: '#/components/schemas/available_days'
      responses:
        200:
          description: Jugador actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Player'
        400:
          description: Datos inválidos
        404:
          description: Jugador no encontrado
        500:
          description: Error al actualizar jugador

    delete:
      tags:
        - Player
      summary: Deshabilita un jugador
      description: Deshabilita un jugador según la CI proporcionado. Este borrado es lógico y no elimina físicamente el registro.
      parameters:
        - name: ci
          in: path
          description: CI del jugador
          required: true
          schema:
            type: string
      responses:
        200:
          description: Jugador deshabilitado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: Jugador no encontrado
        500:
          description: Error del servidor

  /player/delete/{ci}:
    delete:
      tags:
        - Player
      summary: Elimina físicamente un jugador
      description: Elimina físicamente un jugador según la CI proporcionado.
      parameters:
        - name: ci
          in: path
          description: CI del jugador
          required: true
          schema:
            type: string
      responses:
        200:
          description: Jugador eliminado físicamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: Jugador no encontrado
        500:
          description: Error del servidor

components:
  schemas:
    Player:
      type: object
      properties:
        ci:
          type: string
          description: Cédula de identidad del jugador
        first_name:
          type: string
          description: Primer nombre del jugador
        last_name:
          type: string
          description: Apellido del jugador
        phone:
          type: string
          description: Teléfono del jugador
        semester:
          type: integer
          description: Semestre del jugador
        career_id:
          type: integer
          description: ID de la carrera del jugador
        tier_id:
          type: integer
          description: ID del nivel del jugador
        elo:
          type: integer
          nullable: true
          description: Puntuación ELO del jugador
        status:
          type: boolean
          description: Estado del jugador (true=activo, false=inactivo)
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación
        updatedAt:
          type: string
          format: date-time
          description: Fecha de última actualización
    available_days:
      type: array
      items:
        type: integer
      description: Lista de IDs de días disponibles (day_id)