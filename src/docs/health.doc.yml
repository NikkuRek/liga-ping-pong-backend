# DESCRIPTION: Endpoint para verificar el estado de la aplicación y la conexión a la base de datos lpp_db_v3.
paths:
  /health:
    get:
      tags:
        - Health
      summary: Verifica el estado de la aplicación
      description: Retorna el estado de la aplicación y la conexión a la base de datos lpp_db_v3.
      responses:
        200:
          description: La aplicación está funcionando correctamente y la base de datos lpp_db_v3 está conectada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Estado de la aplicación.
                  database:
                    type: string
                    description: Estado de la conexión a la base de datos lpp_db_v3.
                  database_name:
                    type: string
                    description: Nombre de la base de datos conectada.
              examples:
                success:
                  value:
                    status: "ok"
                    database: "connected"
                    database_name: "lpp_db_v3"
        500:
          description: Error en la conexión a la base de datos lpp_db_v3.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Estado de la aplicación.
                  database:
                    type: string
                    description: Estado de la conexión a la base de datos lpp_db_v3.
                  database_name:
                    type: string
                    description: Nombre de la base de datos conectada.
              examples:
                error:
                  value:
                    status: "error"
                    database: "disconnected"
                    database_name: "lpp_db_v3"
