paths:
  /health:
    get:
      tags:
        - Health
      summary: Verificar estado de la API
      description: Retorna información sobre el estado del servidor y la conexión a la base de datos PostgreSQL.
      responses:
        200:
          description: API operativa y DB conectada.
          content:
            application/json:
              example:
                status: "ok"
                database: "connected"
                database_name: "lpp_db"
        500:
          description: Error en la conexión a la base de datos.

  /health/token:
    get:
      tags:
        - Health
      summary: Validar token JWT
      description: Verifica si el token Bearer proporcionado es válido y retorna el payload del usuario.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Token válido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "valid"
                  user:
                    $ref: '#/src/docs/player.doc.yml#/components/schemas/Player'
        401:
          description: Token ausente, inválido o expirado.
