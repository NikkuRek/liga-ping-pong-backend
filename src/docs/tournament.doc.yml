paths:
  /tournament:
    get:
      tags:
        - Tournament
      summary: Obtiene todos los torneos
      description: Retorna un array con todos los torneos registrados
      responses:
        200:
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tournament'
        500:
          description: Error al obtener torneos

    post:
      tags:
        - Tournament
      summary: Crea un nuevo torneo
      description: Crea un nuevo torneo con los datos proporcionados
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentCreate'
      responses:
        201:
          description: Torneo creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Tournament'
        400:
          description: Datos inválidos o nombre de torneo duplicado
        500:
          description: Error al crear torneo

  /tournament/{id}:
    get:
      tags:
        - Tournament
      summary: Obtiene un torneo por ID
      description: Retorna un torneo según el ID proporcionado
      parameters:
        - name: id
          in: path
          description: ID del torneo
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Tournament'
        404:
          description: Torneo no encontrado
        400:
          description: ID inválido
        500:
          description: Error al obtener torneo

    put:
      tags:
        - Tournament
      summary: Actualiza un torneo
      description: Actualiza los datos de un torneo según el ID proporcionado
      parameters:
        - name: id
          in: path
          description: ID del torneo
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentUpdate'
      responses:
        200:
          description: Torneo actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Tournament'
        400:
          description: Datos inválidos o nombre de torneo duplicado
        404:
          description: Torneo no encontrado
        500:
          description: Error al actualizar torneo

    delete:
      tags:
        - Tournament
      summary: Elimina un torneo
      description: Elimina un torneo según el ID proporcionado
      parameters:
        - name: id
          in: path
          description: ID del torneo
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Torneo eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: Torneo no encontrado
        500:
          description: Error al eliminar torneo

components:
  schemas:
    Tournament:
      type: object
      properties:
        tournament_id:
          type: integer
          description: ID del torneo
        name:
          type: string
          description: Nombre del torneo
        description:
          type: string
          nullable: true
          description: Descripción del torneo
        tournament_type:
          type: string
          enum: [Individual, Dobles]
          description: Tipo de torneo
        format:
          type: string
          description: Formato del torneo
        start_date:
          type: string
          format: date
          description: Fecha de inicio
        end_date:
          type: string
          format: date
          nullable: true
          description: Fecha de fin
        status:
          type: string
          enum: [Próximo, En Curso, Finalizado, Cancelado]
          description: Estado del torneo
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación
        updatedAt:
          type: string
          format: date-time
          description: Fecha de última actualización

    TournamentCreate:
      type: object
      required:
        - name
        - tournament_type
        - format
        - start_date
        - status
      properties:
        name:
          type: string
          description: Nombre del torneo
        description:
          type: string
          nullable: true
          description: Descripción del torneo
        tournament_type:
          type: string
          enum: [Individual, Dobles]
          description: Tipo de torneo
        format:
          type: string
          description: Formato del torneo
        start_date:
          type: string
          format: date
          description: Fecha de inicio
        end_date:
          type: string
          format: date
          nullable: true
          description: Fecha de fin
        status:
          type: string
          enum: [Próximo, En Curso, Finalizado, Cancelado]
          description: Estado del torneo

    TournamentUpdate:
      type: object
      properties:
        name:
          type: string
          description: Nombre del torneo
        description:
          type: string
          nullable: true
          description: Descripción del torneo
        tournament_type:
          type: string
          enum: [Individual, Dobles]
          description: Tipo de torneo
        format:
          type: string
          description: Formato del torneo
        start_date:
          type: string
          format: date
          description: Fecha de inicio
        end_date:
          type: string
          format: date
          nullable: true
          description: Fecha de fin
        status:
          type: string
          enum: [Próximo, En Curso, Finalizado, Cancelado]
          description: Estado del torneo