components:
  schemas:
    Tournament:
      type: object
      properties:
        tournament_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Torneo de Primavera 2023"
        description:
          type: string
          nullable: true
          example: "Torneo semestral de ping pong"
        tournament_type:
          type: string
          example: "Individual"
          enum: ["Individual", "Dobles"]
        format:
          type: string
          example: "Eliminación directa"
        start_date:
          type: string
          format: date
          example: "2023-05-15"
        end_date:
          type: string
          format: date
          nullable: true
          example: "2023-05-30"
        status:
          type: string
          example: "Próximo"
          enum: ["Próximo", "En Curso", "Finalizado", "Cancelado"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - tournament_type
        - format
        - start_date
        - status

    TournamentInput:
      type: object
      properties:
        name:
          type: string
          example: "Torneo de Primavera 2023"
        description:
          type: string
          nullable: true
          example: "Torneo semestral de ping pong"
        tournament_type:
          type: string
          example: "Individual"
          enum: ["Individual", "Dobles"]
        format:
          type: string
          example: "Eliminación directa"
        start_date:
          type: string
          format: date
          example: "2023-05-15"
        end_date:
          type: string
          format: date
          nullable: true
          example: "2023-05-30"
        status:
          type: string
          example: "Próximo"
          enum: ["Próximo", "En Curso", "Finalizado", "Cancelado"]
      required:
        - name
        - tournament_type
        - format
        - start_date
        - status
