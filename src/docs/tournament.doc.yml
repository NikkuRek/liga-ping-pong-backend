paths:
  /tournament:
    get:
      tags:
        - Tournament
      summary: Listar todos los torneos
      responses:
        200:
          description: Lista de torneos.

    post:
      tags:
        - Tournament
      summary: Crear nuevo torneo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentInput'
      responses:
        201:
          description: Torneo creado.

  /tournament/player/{player_ci}:
    get:
      tags:
        - Tournament
      summary: Listar torneos donde participa un jugador
      parameters:
        - name: player_ci
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Torneos del jugador.

  /tournament/{id}:
    get:
      tags:
        - Tournament
      summary: Obtener torneo por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Detalles del torneo.

    put:
      tags:
        - Tournament
      summary: Actualización completa del torneo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentInput'
      responses:
        200:
          description: Torneo actualizado.

    patch:
      tags:
        - Tournament
      summary: Actualización parcial del torneo
      description: Permite cambiar el estado (En Curso, Finalizado, etc.) o la fecha sin re-enviar todo.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                  enum: [Pendiente, En Curso, Finalizado]
      responses:
        200:
          description: Torneo actualizado parcialmente.

    delete:
      tags:
        - Tournament
      summary: Eliminar torneo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Torneo eliminado.

components:
  schemas:
    Tournament:
      type: object
      properties:
        tournament_id:
          type: integer
        name:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TournamentInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        status:
          type: string