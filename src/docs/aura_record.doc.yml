paths:
  /aura_record:
    get:
      tags:
        - AuraRecord
      summary: Listar todos los registros de AURA (Paginado)
      description: Retorna el historial completo de cambios de puntuación AURA con soporte para paginación y cálculos de diferencia al vuelo.
      parameters:
        - name: limit
          in: query
          description: Cantidad de registros por página.
          schema:
            type: integer
        - name: page
          in: query
          description: Número de página.
          schema:
            type: integer
      responses:
        200:
          description: Listado obtenido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuraRecordListResponse'

  /aura_record/{id}:
    get:
      tags:
        - AuraRecord
      summary: Obtener registro de AURA por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Detalles del registro.

  /aura_record/player/{player_ci}:
    get:
      tags:
        - AuraRecord
      summary: Listar historial de AURA de un jugador
      parameters:
        - name: player_ci
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Historial del jugador.

  /aura_record/match/{matchId}:
    get:
      tags:
        - AuraRecord
      summary: Listar registros de AURA generados por un partido
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Registros del partido.

components:
  schemas:
    AuraRecord:
      type: object
      properties:
        aura_record_id:
          type: integer
        match_id:
          type: integer
        player_ci:
          type: string
        player_name:
          type: string
        previous_aura:
          type: integer
        new_aura:
          type: integer
        change_aura:
          type: string
        date:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuraRecordListResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuraRecord'
        meta:
          type: object
          properties:
            totalItems:
              type: integer
            itemsPerPage:
              type: integer
            currentPage:
              type: integer
            totalPages:
              type: integer
