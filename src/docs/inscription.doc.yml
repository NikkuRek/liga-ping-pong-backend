paths:
  /inscription:
    get:
      tags:
        - Inscription
      summary: Listar todas las inscripciones
      description: Retorna un listado de jugadores y equipos inscritos en los distintos torneos.
      responses:
        200:
          description: Operación exitosa.

    post:
      tags:
        - Inscription
      summary: Inscribir jugador o equipo
      description: Registra la participación de un individuo o pareja en un torneo específico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InscriptionInput'
      responses:
        201:
          description: Inscripción exitosa.
        400:
          description: El jugador/equipo ya está inscrito o los datos son inválidos.

  /inscription/{id}:
    get:
      tags:
        - Inscription
      summary: Obtener inscripción por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Detalles de la inscripción.

    put:
      tags:
        - Inscription
      summary: Actualización completa de inscripción
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InscriptionInput'
      responses:
        200:
          description: Inscripción actualizada.

    patch:
      tags:
        - Inscription
      summary: Actualización parcial (ej. Seed)
      description: Permite actualizar campos como el seed sin re-enviar la relación de torneo/jugador.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seed:
                  type: integer
      responses:
        200:
          description: Inscripción actualizada parcialmente.

    delete:
      tags:
        - Inscription
      summary: Eliminar inscripción
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Inscripción eliminada.

  /inscription/tournament/{tournamentId}:
    get:
      tags:
        - Inscription
      summary: Listar inscritos por torneo
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Lista de inscritos en el torneo.

components:
  schemas:
    Inscription:
      type: object
      properties:
        inscription_id:
          type: integer
        tournament_id:
          type: integer
        player_ci:
          type: string
          nullable: true
        team_id:
          type: integer
          nullable: true
        seed:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InscriptionInput:
      type: object
      required:
        - tournament_id
      properties:
        tournament_id:
          type: integer
        player_ci:
          type: string
        team_id:
          type: integer
        seed:
          type: integer
