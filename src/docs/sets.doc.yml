paths:
  /sets:
    get:
      tags:
        - Sets
      summary: Listar todos los sets registrados (Paginado)
      description: Retorna un listado de todos los sets de todos los partidos con soporte para paginación.
      parameters:
        - name: limit
          in: query
          description: Cantidad de registros por página.
          schema:
            type: integer
        - name: page
          in: query
          description: Número de página.
          schema:
            type: integer
      responses:
        200:
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetsListResponse'

    post:
      tags:
        - Sets
      summary: Registrar nuevo set
      description: Agrega un set a un partido específico. Si no se indica el número de set, se asigna el siguiente disponible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetsInput'
      responses:
        201:
          description: Set creado.

  /sets/{id}:
    get:
      tags:
        - Sets
      summary: Obtener set por ID
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        200:
          description: Detalles del set.

    put:
      tags:
        - Sets
      summary: Actualización completa del set
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetsInput'
      responses:
        200:
          description: Set actualizado.

    patch:
      tags:
        - Sets
      summary: Actualización parcial del set
      description: Permite actualizar solo el puntaje de uno de los participantes.
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                score_participant1:
                  type: integer
                score_participant2:
                  type: integer
      responses:
        200:
          description: Set actualizado parcialmente.

    delete:
      tags:
        - Sets
      summary: Eliminar set
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        200:
          description: Set eliminado.

  /sets/match/{matchId}:
    get:
      tags:
        - Sets
      summary: Listar sets de un partido
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Sets del partido.

components:
  parameters:
    idParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    Sets:
      type: object
      properties:
        set_id:
          type: integer
        match_id:
          type: integer
        set_number:
          type: integer
        score_participant1:
          type: integer
        score_participant2:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SetsListResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sets'
        meta:
          type: object
          properties:
            totalItems:
              type: integer
            itemsPerPage:
              type: integer
            currentPage:
              type: integer
            totalPages:
              type: integer

    SetsInput:
      type: object
      required:
        - match_id
      properties:
        match_id:
          type: integer
        set_number:
          type: integer
        score_participant1:
          type: integer
        score_participant2:
          type: integer
