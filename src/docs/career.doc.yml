paths:
  /career:
    get:
      tags:
        - Career
      summary: Listar todas las carreras
      responses:
        200:
          description: Listado de carreras obtenido exitosamente.

    post:
      tags:
        - Career
      summary: Crear nueva carrera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareerInput'
      responses:
        201:
          description: Carrera creada.

  /career/{id}:
    get:
      tags:
        - Career
      summary: Obtener carrera por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Detalles de la carrera.

    put:
      tags:
        - Career
      summary: Actualización completa de carrera
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareerInput'
      responses:
        200:
          description: Carrera actualizada.

    patch:
      tags:
        - Career
      summary: Actualización parcial de carrera
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        200:
          description: Carrera actualizada parcialmente.

    delete:
      tags:
        - Career
      summary: Eliminar carrera
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Carrera eliminada.

components:
  schemas:
    Career:
      type: object
      properties:
        career_id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CareerInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
